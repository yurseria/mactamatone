name: Release

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-26
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Verify tag matches app version
        shell: bash
        run: |
          version=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' Info.plist)
          if [[ "$GITHUB_REF_NAME" != "v$version" ]]; then
            echo "Tag $GITHUB_REF_NAME does not match app version $version" >&2
            exit 1
          fi

      - name: Build and package Apple Silicon DMG
        shell: bash
        run: ./scripts/package-dmg.sh

      - name: Verify resources in the packaged DMG
        shell: bash
        run: |
          version=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' Info.plist)
          ./scripts/verify-packaged-app.sh "dist/Mactamatone_${version}_aarch64.dmg"

      - name: Sign update and generate appcast
        shell: bash
        env:
          SPARKLE_PRIVATE_KEY: ${{ secrets.SPARKLE_PRIVATE_KEY }}
        run: |
          if [[ -z "$SPARKLE_PRIVATE_KEY" ]]; then
            echo 'SPARKLE_PRIVATE_KEY is required to publish signed updates.' >&2
            exit 1
          fi
          ./scripts/generate-update-feed.sh

      - name: Publish GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' Info.plist)
          gh release create "$GITHUB_REF_NAME" "dist/Mactamatone_${version}_aarch64.dmg" "dist/appcast.xml" \
            --title "Mactamatone $version" --generate-notes --verify-tag
